<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciência Espacial - Ciências</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="game-header">
    <span class="subject-tag">Ciências</span>
    <h1>Ciência Espacial</h1>
  </header>

  <main class="game-container two-area-layout">
    <!-- Área 1: Perguntas / Instruções / Painel Lateral -->
    <section class="area-painel" id="area-painel">
      <div class="card-instrucoes">
        <h2>Instruções</h2>
        <p>Espaço reservado para perguntas, missões e conceitos científicos.</p>
      </div>
    </section>

    <!-- Área 2: Espaço Interativo / Mecânica de Jogo -->
    <section class="area-interativa" id="area-interativa">
      <div class="canvas-placeholder">
        <p>Área Interativa (Ciência Espacial)</p>
      </div>
    </section>
  </main>

  <script src="jogo.js"></script>
</body>
</html>
