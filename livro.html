<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bena Studies • O Livro de Descobertas</title>
  <link rel="icon" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/livro.css">
</head>
<body>

  <!-- Cabeçalho Oficial Limpo e Minimalista -->
  <header class="livro-header">
    <a class="brand" href="index.html" aria-label="Bena Studies, início">
      <span class="brand-icon">b<span>✦</span></span>
      <span>Bena<span class="brand-light">Studies</span></span>
    </a>
    <div class="header-actions">
      <button class="sound-btn" id="soundToggle" aria-label="Alternar efeitos de som" aria-pressed="true">
        <span id="soundIcon">🔊</span> Som
      </button>
      <button class="login-btn" data-login>Entrar <span>↗</span></button>
    </div>
  </header>

  <!-- Palco Imersivo 3D -->
  <main class="main-stage">
    <!-- Halo de iluminação ambiente -->
    <div class="ambient-halo"></div>

    <!-- Canvas de Erupção de Partículas e Símbolos -->
    <canvas id="particles-canvas"></canvas>

    <!-- Estrutura Tridimensional do Livro -->
    <div class="book-wrap is-closed" id="bookWrap">
      <div class="book" id="magicBook" role="button" aria-label="Abrir o Livro de Descobertas" tabindex="0">
        <!-- Bloco de páginas traseiras e bordas douradas -->
        <div class="book-base"></div>
        <div class="book-edges-right"></div>
        <div class="book-edges-bottom"></div>
        <div class="book-spine"></div>

        <!-- Página interna direita (Right spread) -->
        <div class="open-spread-right">
          <div class="book-gutter"></div>
        </div>

        <!-- Cenário Pop-Up 3D que ergue-se das páginas -->
        <div class="popup-diorama" id="popupDiorama">
          <div class="popup-art"></div>

          <!-- Destinos Selecionáveis de Navegação -->
          <div class="destinations-overlay">
            <button class="destination-card dest-math" data-dest="matematica" title="Explorar Matemática">
              <div class="destination-icon">×</div>
              <div class="destination-info">
                <span class="destination-title">Matemática</span>
                <span class="destination-sub">Torre dos Números</span>
                <span class="badge-active">Disponível</span>
              </div>
            </button>

            <button class="destination-card dest-port" data-dest="portugues" title="Explorar Português">
              <div class="destination-icon">Aa</div>
              <div class="destination-info">
                <span class="destination-title">Português</span>
                <span class="destination-sub">Vale das Letras</span>
              </div>
            </button>

            <button class="destination-card dest-scie" data-dest="ciencias" title="Explorar Ciências">
              <div class="destination-icon">🔬</div>
              <div class="destination-info">
                <span class="destination-title">Ciências</span>
                <span class="destination-sub">Observatório</span>
              </div>
            </button>

            <button class="destination-card dest-geog" data-dest="geografia" title="Explorar Geografia">
              <div class="destination-icon">🌍</div>
              <div class="destination-info">
                <span class="destination-title">Geografia</span>
                <span class="destination-sub">Exploradores</span>
              </div>
            </button>

            <button class="destination-card dest-engl" data-dest="ingles" title="Explorar Inglês">
              <div class="destination-icon">🇬🇧</div>
              <div class="destination-info">
                <span class="destination-title">Inglês</span>
                <span class="destination-sub">Ponte de Idiomas</span>
              </div>
            </button>

            <button class="destination-card dest-hist" data-dest="historia" title="Explorar História">
              <div class="destination-icon">🏛️</div>
              <div class="destination-info">
                <span class="destination-title">História</span>
                <span class="destination-sub">Templo do Tempo</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Folhas intermediárias que folheiam rapidamente ("Leaf through") -->
        <div class="turning-page"><div class="page-sheet-content"></div></div>
        <div class="turning-page"><div class="page-sheet-content"></div></div>
        <div class="turning-page"><div class="page-sheet-content"></div></div>
        <div class="turning-page"><div class="page-sheet-content"></div></div>

        <!-- Capa Frontal Tridimensional -->
        <div class="book-cover">
          <div class="book-cover-front">
            <div class="cover-sheen"></div>
            <div class="flutter-corner" aria-hidden="true"></div>
          </div>
          <div class="book-cover-back">
            <div class="page-interior-left">
              <div>
                <h3>Bena Studies</h3>
                <p>O universo onde a curiosidade se transforma em aventura e conhecimento real.</p>
              </div>
              <div class="page-doodle">✦ Escolha seu destino ao lado e comece a jogar! ↗</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Convite Suave (Estado Fechado) -->
    <div class="instruction-callout" id="instructionCallout">
      <div class="instruction-pill">
        <span>✦</span> Toque no livro para abrir seu mundo de descobertas
      </div>
    </div>

    <!-- Controles de Navegação (Estado Aberto) -->
    <div class="open-controls" id="openControls">
      <button class="ctrl-btn" id="btnReplay"><span>↺</span> Folhear novamente</button>
      <button class="ctrl-btn" id="btnClose"><span>✕</span> Fechar o livro</button>
    </div>
  </main>

  <!-- Modal Dialog de Jogos e Destinos -->
  <dialog id="game-dialog">
    <button class="dialog-close" id="dialogClose" aria-label="Fechar modal">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <!-- Dependências e Scripts da Aplicação -->
  <script src="config/site.js"></script>
  <script src="conteudo/catalogo.js"></script>
  <script src="assets/livro.js"></script>
  <script type="module" src="assets/componentes/auth.js"></script>
</body>
</html>
