<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de Jogo - Duas Áreas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="game-template-header">
    <a href="../../index.html" class="header-back-link">← Voltar aos jogos</a>
    <span class="header-brand">Bena Studies <b class="header-star">✦</b></span>
  </header>

  <main class="game-container two-area-layout">
    <!-- Área 1: Painel Lateral / Pergunta / Instruções -->
    <section class="area-painel" id="area-painel">
      <div class="card-instrucoes">
        <h2>Instruções</h2>
        <p>Espaço reservado para perguntas, instruções e controles do jogo.</p>
      </div>
    </section>

    <!-- Área 2: Área Interativa / Canvas / Tabuleiro -->
    <section class="area-interativa" id="area-interativa">
      <div class="canvas-placeholder">
        <p>Área Interativa Principal</p>
      </div>
    </section>
  </main>
</body>
</html>
